name: CodeQL

on:
  push:
    branches:
      - "master"
      - "dev"
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Monday 6am UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL (${{ matrix.language }})
    # Dependabot PRs bump lock/manifest files only; scanning each one burned the
    # org standard runner pool (auditor-toolkit #3739). Push + schedule still scan.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload CodeQL results to security tab
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialise CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}

      - name: Run analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
