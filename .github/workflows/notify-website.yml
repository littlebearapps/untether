name: Notify Website (manual catch-up)

# Manual catch-up only: re-sends the littlebearapps.com rebuild for a given release tag.
# Releases notify the site from release.yml's notify-littlebearapps job. This workflow used to
# listen for `release: published`, which never fires for releases created with GITHUB_TOKEN,
# so it silently stopped after v0.34.2 (#1014). Kept manual-only so a release can't dispatch twice.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to announce (e.g. v0.36.0)"
        required: true
        type: string

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch release-published to littlebearapps.com
        env:
          TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([a-z0-9.]*)?$ ]]; then
            echo "::error::'$TAG_NAME' doesn't look like a release tag (vX.Y.Z)."
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::WEBSITE_DISPATCH_TOKEN isn't set, so littlebearapps.com wasn't notified."
            exit 1
          fi
          payload=$(jq -n --arg tag "$TAG_NAME" '{event_type:"release-published",client_payload:{repo:"untether",tag:$tag}}')
          code=$(curl --silent --show-error --output "$RUNNER_TEMP/resp.json" --write-out '%{http_code}' \
            -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/littlebearapps/littlebearapps.com/dispatches -d "$payload")
          if [ "$code" != "204" ]; then
            echo "::error::littlebearapps.com dispatch returned HTTP $code (expected 204)"
            cat "$RUNNER_TEMP/resp.json"
            exit 1
          fi
          echo "littlebearapps.com notified for $TAG_NAME (HTTP 204)"
